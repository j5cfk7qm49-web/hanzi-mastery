name: Verify Hanzi Mastery
on: [push, pull_request]
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install chromium webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hanzi-mastery-build-and-tests
          path: |
            release/*-plugin.zip
            test-results/
